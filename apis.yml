- aid: freshdesk:webhook-api
  name: Freshdesk Webhook API
  tags:
  - Automation
  - Customer Support
  - Events
  - Notifications
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://support.freshdesk.com/support/solutions/folders/272646
  properties:
  - url: https://support.freshdesk.com/support/solutions/folders/272646
    type: Documentation
  - url: asyncapi/freshdesk-webhook-api-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Freshdesk Webhook API enables real-time communication between Freshdesk and external systems by
    sending HTTP POST requests when specific events occur within the helpdesk. Webhooks can be triggered
    by ticket creation, updates, status changes, and other support events, allowing developers to build
    event-driven integrations without polling the REST API.
