    type: Documentation
  description: >-
    The Freshdesk App SDK allows developers to build custom applications that extend the functionality
    of the Freshdesk helpdesk platform. Backed by a Platform-as-a-Service infrastructure that includes
    a data store and serverless runtimes, the SDK provides tools for creating front-end interfaces using
    the Crayons component library and server-side logic through serverless apps.
